<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Coding and hackathon event">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="170" fill="#22d3ee" fill-opacity="0.14"/>
  <circle cx="160" cy="560" r="190" fill="#818cf8" fill-opacity="0.14"/>
  <rect x="90" y="120" width="480" height="440" rx="20" fill="#0b1220" stroke="#334155" stroke-width="4"/>
  <circle cx="140" cy="165" r="9" fill="#f87171"/>
  <circle cx="172" cy="165" r="9" fill="#facc15"/>
  <circle cx="204" cy="165" r="9" fill="#4ade80"/>
  <text x="130" y="250" font-family="ui-monospace, monospace" font-size="30" fill="#22d3ee">&gt; import cics</text>
  <text x="130" y="310" font-family="ui-monospace, monospace" font-size="30" fill="#a78bfa">const { build } = await</text>
  <text x="130" y="360" font-family="ui-monospace, monospace" font-size="30" fill="#a78bfa">  student.ideas();</text>
  <text x="130" y="430" font-family="ui-monospace, monospace" font-size="30" fill="#34d399">build.deploy();</text>
  <rect x="660" y="200" width="450" height="120" rx="16" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <text x="885" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#e2e8f0">48-Hour Hackathon</text>
  <text x="885" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8">Code. Create. Compete.</text>
</svg>
